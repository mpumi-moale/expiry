<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Expiry Tracker</title>
    <style>
      :root {
        --bg: #f6f7f4;
        --card: #fff;
        --tx: #1d2a22;
        --mut: #66736b;
        --bd: #dde3dd;
        --ac: #1f7a4d;
        --acx: #fff;
        --ok: #1f7a4d;
        --warn: #b7791f;
        --bad: #c0392b;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a16;
          --card: #1d251f;
          --tx: #e8efe9;
          --mut: #9aa89f;
          --bd: #2c372f;
          --ac: #4cc38a;
          --acx: #0d1a12;
          --ok: #4cc38a;
          --warn: #e0b04a;
          --bad: #ef7a6c;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          16px/1.45 system-ui,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 8px 0 4px;
      }
      h2 {
        font-size: 16px;
        margin: 20px 0 8px;
      }
      .mut {
        color: var(--mut);
        font-size: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 14px;
        margin: 10px 0;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--mut);
        margin: 10px 0 4px;
      }
      input {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        color: var(--tx);
        font: inherit;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 8px;
        padding: 11px 14px;
        background: var(--ac);
        color: var(--acx);
        cursor: pointer;
        font-weight: 600;
      }
      button.sec {
        background: transparent;
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      button.lnk {
        background: none;
        color: var(--ac);
        padding: 4px;
      }
      button:disabled {
        opacity: 0.5;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      .top,
      .item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .pill {
        font-size: 12px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 99px;
        border: 1px solid currentColor;
        white-space: nowrap;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .err {
        color: var(--bad);
        font-size: 14px;
        min-height: 20px;
        margin-top: 8px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="auth">
        <h1>Expiry Tracker</h1>
        <p class="mut">Get a text before your food or medicine expires.</p>
        <p class="mut">Demo preview: registration and login are temporary and are not saved.</p>
        <div class="card">
          <div class="row">
            <button id="tL" type="button">Log in</button
            ><button id="tR" type="button" class="sec">Register</button>
          </div>
          <div id="nameW" hidden>
            <label for="nm">Your name</label
            ><input id="nm" autocomplete="name" />
          </div>
          <label for="ph">Mobile number</label
          ><input
            id="ph"
            type="tel"
            placeholder="0749218437"
            autocomplete="tel"
          />
          <label for="pw">Password (8+ characters)</label
          ><input id="pw" type="password" autocomplete="current-password" />
          <div class="err" id="aerr"></div>
          <button id="go" type="button" style="width: 100%">Log in</button>
        </div>
      </section>
      <section id="app" hidden>
        <div class="top">
          <div>
            <h1 id="hi"></h1>
            <div class="mut" id="sub"></div>
          </div>
          <button class="sec" id="out" type="button">Log out</button>
        </div>
        <div class="card">
          <h2 style="margin-top: 0">Add a product</h2>
          <label for="pn">Product name</label
          ><input id="pn" placeholder="e.g. Greek yogurt" />
          <label for="pd">Expiration date</label><input id="pd" type="date" />
          <div class="row" style="margin-top: 12px">
            <button id="scanB" type="button" class="sec">📷 Scan date</button
            ><button id="add" type="button">Add product</button>
          </div>
          <input
            id="file"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
          />
          <div class="mut" id="scanMsg" style="margin-top: 8px"></div>
          <div class="err" id="perr"></div>
        </div>
        <h2>Your products</h2>
        <div id="list"></div>
        <p class="mut">Demo preview: products are not saved and no texts are sent.</p>
      </section>
    </main>
    <script>
      const $ = (i) => document.getElementById(i);
      let mode = "login";
      const todayS = () => {
        const d = new Date();
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      };
      function setMode(m) {
        mode = m;
        $("nameW").hidden = m !== "register";
        $("go").textContent = m === "register" ? "Create account" : "Log in";
        $("tL").className = m === "login" ? "" : "sec";
        $("tR").className = m === "register" ? "" : "sec";
        $("aerr").textContent = "";
      }
      $("tL").onclick = () => setMode("login");
      $("tR").onclick = () => setMode("register");
      $("go").onclick = () => {
        const phone = $("ph").value.trim();
        const password = $("pw").value;
        $("aerr").textContent = "";
        if (!phone || !password) {
          $("aerr").textContent = "Enter a mobile number and password to continue.";
          return;
        }
        if (mode === "register" && password.length < 8) {
          $("aerr").textContent = "Password must be at least 8 characters.";
          return;
        }
        // Frontend preview only: accept the form without saving credentials.
        const name = mode === "register" ? $("nm").value.trim() || "there" : "there";
        $("pw").value = "";
        show({ name, phone });
      };
      function logout() {
        $("app").hidden = true;
        $("auth").hidden = false;
        $("pw").value = "";
      }
      $("out").onclick = logout;
      function show(u) {
        $("auth").hidden = true;
        $("app").hidden = false;
        $("hi").textContent = "Hi, " + u.name;
        $("sub").textContent = "Texts go to " + u.phone;
        $("pd").min = todayS();
        $("list").innerHTML = '<div class="card mut">Demo preview: products are not saved yet.</div>';
      }
      $("add").onclick = () => {
        $("perr").textContent = "Demo preview: products are not saved yet.";
      };
      $("scanB").onclick = () => {
        $("scanMsg").textContent = "Photo scanning is not connected in the frontend preview.";
      };
    </script>
  </body>
</html>
